id: intervals/reassertion-overlap-control
title: Control - restating a fact that is still true merges into it
source: https://github.com/getzep/graphiti/issues/1865 (overlapping restatement stays a duplicate)
family: re-assertion
judge: scripted
facts:
  - {id: old, src: Alex, rel: ASSIGNED_TO, dst: Payments, fact: Alex is assigned to Payments.,
     valid: 2026-01-01, claim: [Alex, assignment, Payments]}
incoming:
  - {id: again, src: Alex, rel: ASSIGNED_TO, dst: Payments, fact: Alex is assigned to Payments.,
     valid: 2026-01-21, claim: [Alex, assignment, Payments]}
script:
  Alex is assigned to Payments.:
    duplicates: [Alex is assigned to Payments.]
expect:
  again: {merged_into: old}
  old: {open: true}
