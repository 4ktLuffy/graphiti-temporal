[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphiti-temporal"
version = "0.1.0"
description = "Keep Graphiti's temporal answers correct as a graph accumulates history, and measure it."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Pinned to the commit every finding was measured on.
dependencies = [
    "graphiti-core @ git+https://github.com/getzep/graphiti@4f98b7ca45fef96925dc04134c42c526df73bb28",
    # graphiti-core imports httpx without declaring it (getzep/graphiti#1893).
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
graphiti-gate = "graphiti_gate.cli:main_exit"

[project.optional-dependencies]
dev = [
    "coverage>=7.16.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["graphiti_temporal", "graphiti_gate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# The same rules as graphiti-core.
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
